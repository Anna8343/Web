<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практична робота №5 - Валідація форм</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Форма реєстрації</h1>
            <p class="author-info">Виконала: Манченко Анна</p>
        </header>
        
        <form id="registrationForm">
            <div class="form-group">
                <label for="username">Ім'я користувача:</label>
                <input type="text" id="username" name="username">
                <span class="error" id="usernameError"></span>
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
                <span class="error" id="emailError"></span>
            </div>
            
            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password">
                <span class="error" id="passwordError"></span>
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Підтвердження паролю:</label>
                <input type="password" id="confirmPassword" name="confirmPassword">
                <span class="error" id="confirmPasswordError"></span>
            </div>
            
            <div class="form-group">
                <label for="phone">Телефон:</label>
                <input type="tel" id="phone" name="phone" placeholder="+380XXXXXXXXX">
                <span class="error" id="phoneError"></span>
            </div>
            
            <div class="form-group">
                <label for="birthdate">Дата народження:</label>
                <input type="date" id="birthdate" name="birthdate">
                <span class="error" id="birthdateError"></span>
            </div>
            
            <div class="form-group checkbox">
                <input type="checkbox" id="terms" name="terms">
                <label for="terms">Я згоден з умовами користування</label>
                <span class="error" id="termsError"></span>
            </div>
            
            <div class="form-group">
                <button type="submit">Зареєструватися</button>
            </div>
            
            <div id="formSuccess" class="success-message">
                Реєстрація успішна! Дякуємо за реєстрацію.
            </div>
        </form>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
