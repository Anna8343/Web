<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#e9f2ff" rx="8" ry="8"/>
  
  <!-- Фонові елементи, імітація схеми ШІ -->
  <g fill="none" stroke="#b3c9e6" stroke-width="1.5">
    <circle cx="150" cy="200" r="100"/>
    <circle cx="400" cy="200" r="120"/>
    <circle cx="300" cy="150" r="60"/>
    <line x1="150" y1="200" x2="300" y2="150" />
    <line x1="300" y1="150" x2="400" y2="200" />
    <line x1="150" y1="200" x2="400" y2="200" />
  </g>
  
  <!-- Елементи мережі -->
  <g fill="#2d5ba9">
    <circle cx="150" cy="200" r="10"/>
    <circle cx="400" cy="200" r="10"/>
    <circle cx="300" cy="150" r="8"/>
    <circle cx="200" cy="250" r="8"/>
    <circle cx="250" cy="180" r="8"/>
    <circle cx="350" cy="220" r="8"/>
    <circle cx="180" cy="150" r="6"/>
    <circle cx="230" cy="230" r="6"/>
    <circle cx="330" cy="250" r="6"/>
    <circle cx="420" cy="150" r="6"/>
  </g>
  
  <!-- Назва зображення -->
  <text x="300" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#2d5ba9">Штучний інтелект</text>
</svg> 